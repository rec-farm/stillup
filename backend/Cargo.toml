[package]
name = "stillup-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
default-run = "stillup-api"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
icu_collator = "2.2.1"
ryu-js = "1.0.3"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
rsa = { version = "0.9", features = ["sha2"] }
