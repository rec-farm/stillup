services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stillup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stillup}
      POSTGRES_DB: stillup
    ports:
      - '127.0.0.1:5437:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stillup']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    profiles: [app]
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgres://stillup:${POSTGRES_PASSWORD:-stillup}@db:5432/stillup
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    profiles: [app]
    build:
      context: .
      target: api
    command: ['pnpm', '--filter', '@stillup/api', 'worker']
    env_file: .env
    environment:
      DATABASE_URL: postgres://stillup:${POSTGRES_PASSWORD:-stillup}@db:5432/stillup
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    profiles: [app]
    build:
      context: .
      target: web
    environment:
      API_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres-data:
