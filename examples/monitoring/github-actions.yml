# Copy into .github/workflows/monitoring.yml in a repository containing the StillUp workspace.
# Replace the example endpoint and use a protected monitoring-production environment. In StillUp,
# open API access and trust this repository's monitoring.yml on branch main in the
# monitoring-production environment for project example-api. No secret is stored here.
name: Monitoring
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: monitoring-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm stillup validate --config examples/monitoring/stillup.config.ts
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment: monitoring-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm stillup apply --config examples/monitoring/stillup.config.ts --yes
        env:
          STILLUP_URL: ${{ vars.STILLUP_URL }}
