# Copy to the repository root as fly.probe.toml. Choose a globally unique app name and region.
app = "replace-with-your-probe-app"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 60

[build]
  dockerfile = "Dockerfile"
  build-target = "probe"

[env]
  STILLUP_URL = "https://replace-with-your-stillup-host.example"
  STILLUP_PROBE_DATA = "/data/identity"

# No http_service: the probe only makes outbound connections.
[[mounts]]
  source = "probe_identity"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
