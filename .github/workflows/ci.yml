name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stillup
          POSTGRES_PASSWORD: stillup
          POSTGRES_DB: stillup
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U stillup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm exec tsx scripts/generate-contract-fixtures.ts
      - run: git diff --exit-code -- backend/tests/fixtures/check-contracts.json backend/tests/fixtures/assertion-contracts.json backend/tests/fixtures/network-contracts.json backend/tests/fixtures/status-contracts.json backend/tests/fixtures/status-date-contracts.json backend/tests/fixtures/code-contracts.json backend/tests/fixtures/canonical-contracts.json
      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.92.0 fmt --manifest-path backend/Cargo.toml --check
      - run: cargo +1.92.0 clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.92.0 test --manifest-path backend/Cargo.toml --locked
      - run: cargo +1.92.0 test --manifest-path backend/Cargo.toml --locked --test runtime -- --ignored
        env:
          TEST_DATABASE_URL: postgres://stillup:stillup@127.0.0.1:5437/stillup
      - run: pnpm build
      - run: docker build --target api -t stillup-api:ci .
      - run: docker build --target probe -t stillup-probe:ci .
