name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stillup
          POSTGRES_PASSWORD: stillup
          POSTGRES_DB: stillup
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U stillup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @rec/stillup test:package
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm exec tsx scripts/generate-contract-fixtures.ts
      - run: git diff --exit-code -- backend/tests/fixtures/check-contracts.json backend/tests/fixtures/assertion-contracts.json backend/tests/fixtures/network-contracts.json backend/tests/fixtures/status-contracts.json backend/tests/fixtures/status-date-contracts.json backend/tests/fixtures/code-contracts.json backend/tests/fixtures/canonical-contracts.json backend/tests/fixtures/route-integer-contracts.json
      - run: cargo fmt --manifest-path backend/Cargo.toml --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo test --manifest-path backend/Cargo.toml --locked --test runtime -- --ignored
        env:
          TEST_DATABASE_URL: postgres://stillup:stillup@127.0.0.1:5437/stillup
      # The release binary and the image are built by image.yml.
      - run: pnpm --filter @stillup/web build
